<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão de Dossiers — Arq. Leonel Mendes</title><style>
:root{--blue:#173e5b;--teal:#1d7673;--ink:#273238;--soft:#66736f;--paper:#fff;--wash:#f3f6f4;--line:#d6dfdb}*{box-sizing:border-box}body{margin:0;background:#edf1ef;color:var(--ink);font:16px/1.5 Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 18px 52px}.brand{display:flex;align-items:center;gap:12px;padding-bottom:20px;border-bottom:2px solid var(--line)}.brand img{width:48px;height:48px;object-fit:contain}.brand strong{display:block;color:var(--blue);font-size:18px}.brand small{color:var(--soft);text-transform:uppercase;letter-spacing:.5px}.card{margin-top:22px;padding:26px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 25px #163a4910}h1{margin:0 0 7px;color:var(--blue);font-size:26px}p{margin:9px 0}.muted{color:var(--soft)}.status{padding:13px 15px;border-radius:6px;background:var(--wash);color:var(--blue)}table{border-collapse:collapse;width:100%;margin-top:20px;font-size:14px}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}.tag{display:inline-block;padding:3px 7px;border-radius:12px;background:#edf5f4;color:#17625f;font-size:12px;font-weight:bold}.empty{padding:22px;text-align:center;color:var(--soft)}@media(max-width:720px){.card{padding:18px}table{font-size:13px}th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}}</style></head>
<body><main class="wrap"><header class="brand"><img src="images/logo.png" alt="Arq. Leonel Mendes"><div><strong>Arq. Leonel Mendes</strong><small>Área profissional · gestão de processos</small></div></header><section class="card"><h1>Dossiers Digitais</h1><p class="muted">Consulte os processos criados, os respetivos relatórios e os documentos posteriormente recebidos. Esta área é reservada ao atelier.</p><div id="status" class="status">A carregar processos…</div><div id="content" hidden><table><thead><tr><th>Relatório</th><th>Cliente</th><th>Concelho</th><th>Documentos</th><th>Atualização</th><th>Consulta do cliente</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const date=v=>v?new Intl.DateTimeFormat('pt-PT',{dateStyle:'short',timeStyle:'short',timeZone:'Europe/Lisbon'}).format(new Date(v)):'—';async function load(){const status=document.getElementById('status');try{const r=await fetch('/.netlify/functions/listar-dossiers',{credentials:'same-origin'}),raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{}if(!r.ok)throw Error(d.error||'Não foi possível abrir a gestão de processos.');status.innerHTML=`<strong>${d.dossiers.length}</strong> processo(s) registado(s).`;const rows=document.getElementById('rows');rows.innerHTML=d.dossiers.length?d.dossiers.map(x=>`<tr><td><strong>${escape(x.reportReference||x.id)}</strong><br><span class="muted">${escape(x.id)}</span></td><td>${escape(x.email)}</td><td>${escape(x.municipality||'A confirmar')}</td><td><span class="tag">${escape(x.documentCount)} ficheiro(s)</span></td><td>${date(x.updatedAt)}</td><td>${x.lastAccessedAt?date(x.lastAccessedAt):'Ainda não acedeu'}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Ainda não existem processos guardados.</td></tr>';document.getElementById('content').hidden=false}catch(e){status.textContent=e.message||'Não foi possível abrir a gestão de processos.'}}load();
</script></body></html>
